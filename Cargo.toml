[package]
name = "odino"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.8"
bevy = { version = "0.20", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_audio",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_curve",
    "bevy_image",
    "bevy_log",
    "bevy_material",
    "bevy_mesh",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "bevy_dev_tools",
    "default_font",
    "png",
    "std",
    "symphonia-vorbis",
    "vorbis",
    "wayland",
    "webgl2",
    "x11",
] }
bitflags = "2.13.2"
rand = "0.10.3"

[features]
default = ["dev"]
dev = [
    "bevy/debug",
    "bevy/bevy_gizmos",
    "bevy/bevy_gizmos_render",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
]
web = [
    "bevy/web",
    "bevy/webgl2"
]

# Enable a small amount of optimization in the dev profile.
# [profile.dev]
# opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
