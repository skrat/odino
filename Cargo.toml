[package]
name = "odino"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.8"
bevy = { version = "0.20", features = ["bevy_dev_tools"] }
bitflags = "2.13.2"
rand = "0.10.3"

[features]
default = ["dev"]
dev = ["bevy/debug", "bevy/bevy_dev_tools"]

# Enable a small amount of optimization in the dev profile.
# [profile.dev]
# opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
