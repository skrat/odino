<!doctype html>
<html lang="en">
    <head>
        <title>Dino Game</title>
        <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .wrap {
            position: relative;
            aspect-ratio: 600/250;
            background-color: rgba(155, 155, 155, 0.5);
            width: 100%;
        }
        canvas {
            display: none;
            outline: none;
        }
        .trigger {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .trigger p {
            text-align: center;
            font-size: 60px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: bold;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke-width: 3px;
            -webkit-text-stroke-color: white;
            transform: translate(-8px, -8px);
            text-shadow:
            8px 8px #999999,
            20px 20px #000000;
        }
        .progress {
            width: 50%;
            height: 20px;
            background-color: #000000;
            display: none;
        }
        .inner {
            height: 20px;
            width: 0px;
            background-color: #ffffff;
        }
        </style>
    </head>
    <body>
        <div class="wrap">
            <canvas></canvas>
            <div class="trigger">
                <p>Click to play</p>
                <div class="progress"><div class="inner"></div></div>
            </div>
        </div>
        <script type="module">
        import init from './odino.js'

        const trigger = document.querySelector('.trigger');
        const progress = trigger.querySelector('.progress');
        const inner = trigger.querySelector('.inner');
        const canvas = document.querySelector('canvas');

        const onProgress = (loaded, total) => {
          const n = Math.min(1, loaded / total);
          inner.style.width = `${n * 100}%`;
        };
        const onFinished = () => {
          trigger.parentNode.removeChild(trigger);
        };

        const fetch_ = window.fetch;
        window.fetch = async (...args) => {
          const resp_ = await fetch_(...args);

          const contentLength = resp_.headers.get('Content-Length');
          const total = parseInt(contentLength, 10);
          let loaded = 0;

          const resp = new Response(new ReadableStream({
            async start(controller) {
              const reader = resp_.body.getReader();
              for (;;) {
                const {done, value} = await reader.read();
                if (done) {
                  onProgress(total, total)
                  break
                }
                loaded += value.byteLength;
                onProgress(loaded, total)
                controller.enqueue(value);
              }
              controller.close();
              onFinished();
            },
          }, {
            'status': resp_.status,
            'statusText': resp_.statusText
          }));
          for (const pair of resp_.headers.entries()) {
            resp.headers.set(pair[0], pair[1]);
          }
          return resp;
        };

        function main() {
            init().catch((error) => {
                if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
                    throw error;
                }
            });
        }

        let triggered = false;
        trigger.addEventListener('click', () => {
          if (triggered) return;
          triggered = true;
          trigger.removeChild(trigger.querySelector('p'));
          progress.style.display = 'block';
          canvas.style.display = 'block';
          main();
        });
        </script>
    </body>
</html>
